name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create .env file for CI
        run: |
          cat > .env << EOF
          VITE_FIREBASE_API_KEY=demo-api-key-for-ci
          VITE_FIREBASE_AUTH_DOMAIN=puppy-steps-demo.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID=puppy-steps-demo
          VITE_FIREBASE_STORAGE_BUCKET=puppy-steps-demo.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID=123456789
          VITE_FIREBASE_APP_ID=demo-app-id-for-ci
          EOF

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:run

      - name: Build
        run: npm run build
