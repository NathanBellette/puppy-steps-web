name: Playwright Tests

on:
  pull_request:
    branches: [main]

concurrency:
  group: e2e-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  test:
    name: E2E Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create .env file for CI
        run: |
          cat > .env << EOF
          VITE_FIREBASE_API_KEY=demo-api-key-for-ci
          VITE_FIREBASE_AUTH_DOMAIN=puppy-steps-demo.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID=puppy-steps-demo
          VITE_FIREBASE_STORAGE_BUCKET=puppy-steps-demo.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID=123456789
          VITE_FIREBASE_APP_ID=demo-app-id-for-ci
          EOF

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
